categories:
  primary-add: 1
  primary-remove: 1
  replica-add: 1
  replica-remove: 1
  replica-kill: 1
  replica-restart: 1
  slot-migration: 40
  replica-reparent: 1
  #primary-failover: 1

#primary-failover
#replica-reparent

interval: 10
max-failures: 0
abort-on-failure: false

watch: false

wait-timeout: 60

cooldown: 2
slot-strategy: balanced
slot-batch: 512

unsafe: false
